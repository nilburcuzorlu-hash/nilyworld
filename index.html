<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nilyworld</title>
    <style>
      :root {
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
      }

      .kart {
        width: 600px;
        height: 800px;
        background: #ffffff; /* arka fon beyaz */
        box-shadow: var(--shadow); /* gölgeyi aynı şekilde koru */
        border-radius: 16px;
        display: grid;
        place-items: center;
      }

      .isim {
        margin: 0;
        font-size: 42px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <section class="kart">
      <h1 class="isim">nilyworld</h1>
    </section>
  </body>
</html>
